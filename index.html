<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Signal Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg,#0d3c74,#1e88e5);
    color: white;
}

/* container */
.container {
    padding: 20px;
}

/* heading */
h1 {
    font-size: 28px;
    font-weight: bold;
}

/* VIP CIRCLE ANIMATION */
.vip-circle {
    width: 220px;
    height: 220px;
    margin: 20px auto;
    border-radius: 50%;
    border: 6px solid yellow;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    font-weight: bold;
    background: rgba(0,0,0,0.2);
    box-shadow: 0 0 20px yellow;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 10px yellow; }
    50% { transform: scale(1.05); box-shadow: 0 0 25px yellow; }
    100% { transform: scale(1); box-shadow: 0 0 10px yellow; }
}

/* BUTTON ANIMATION */
.btn {
    display: inline-block;
    margin: 20px 0;
    padding: 16px 28px;
    font-size: 18px;
    color: white;
    background: black;
    border-radius: 40px;
    text-decoration: none;
    border: 3px dashed yellow;
    animation: glow 1s infinite alternate, bounce 1.5s infinite;
}

@keyframes glow {
    from { box-shadow: 0 0 5px yellow; }
    to { box-shadow: 0 0 25px yellow; }
}

@keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
}

/* TEXT */
.big {
    font-size: 24px;
    font-weight: bold;
}

/* TIMER */
.timer {
    margin-top: 15px;
    font-size: 24px;
    color: yellow;
}

/* FOOTER */
.footer {
    margin-top: 20px;
    font-size: 16px;
}

.footer span {
    color: yellow;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 VIP SIGNAL HUB 🔥</h1>

<!-- VIP CIRCLE -->
<div class="vip-circle">VIP</div>

<h1>💎 EXCLUSIVE TELEGRAM ACCESS 💎</h1>

<!-- BUTTON -->
<a href="https://t.me/+nT6z4WNxEiVjNDk9" class="btn">
👉 CLICK HERE TO JOIN
</a>

<div class="big">⚡ FREE ENTRY – LIMITED TIME ⚡</div>

<p>Daily Updates • Smart Tips • Fast Results</p>

<div class="timer" id="timer">00 : 00 : 30</div>

<div class="footer">
Ads Managed By <span>Adgency</span>
</div>

</div>

<script>
// TIMER
let time = 30;
setInterval(() => {
let s = time;
document.getElementById("timer").innerHTML =
"00 : 00 : " + (s<10?"0"+s:s);
if(time>0) time--;
},1000);
</script>

</body>
</html>
